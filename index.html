<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Travigo</title>
    <meta name="description" content="Get the latest realtime and scheduled information on public transport in Great Britain">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
    <link rel="mask-icon" href="/favicon.svg" color="#FFFFFF">
    <meta id="theme-color" name="theme-color" content="#f8fafc">
    <script>
      (() => {
        const theme = localStorage.getItem('travigo_theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const dark = theme === 'dark' || (theme !== 'light' && prefersDark)

        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.getElementById('theme-color')?.setAttribute('content', dark ? '#020617' : '#f8fafc')
      })()
    </script>
    <link
      rel="preload"
      href="/font/Inter-roman.var.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/font/inter.css" />
  </head>
  <body class="antialiased font-sans bg-[var(--ui-page)]">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
